AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Public serverless REST API backed by DynamoDB.

Parameters:
  AllowedOrigin:
    Type: String
    Description: Single web origin allowed by API Gateway CORS.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        ITEMS_TABLE:
          Ref: ItemsTable

Resources:
  PublicApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowOrigin:
          Fn::Sub: "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type,Authorization,X-Api-Key'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      Auth:
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: API key usage plan for write operations

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName:
              Ref: ItemsTable
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId:
              Ref: PublicApi
            Path: /health
            Method: GET
        HealthTypoAlias:
          Type: Api
          Properties:
            RestApiId:
              Ref: PublicApi
            Path: /healts
            Method: GET
        ListItems:
          Type: Api
          Properties:
            RestApiId:
              Ref: PublicApi
            Path: /items
            Method: GET
        CreateItem:
          Type: Api
          Properties:
            RestApiId:
              Ref: PublicApi
            Path: /items
            Method: POST
            Auth:
              ApiKeyRequired: true
        GetItem:
          Type: Api
          Properties:
            RestApiId:
              Ref: PublicApi
            Path: /items/{item_id}
            Method: GET
        ReplaceItem:
          Type: Api
          Properties:
            RestApiId:
              Ref: PublicApi
            Path: /items/{item_id}
            Method: PUT
            Auth:
              ApiKeyRequired: true
        PatchItem:
          Type: Api
          Properties:
            RestApiId:
              Ref: PublicApi
            Path: /items/{item_id}
            Method: PATCH
            Auth:
              ApiKeyRequired: true
        DeleteItem:
          Type: Api
          Properties:
            RestApiId:
              Ref: PublicApi
            Path: /items/{item_id}
            Method: DELETE
            Auth:
              ApiKeyRequired: true

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  ApiUrl:
    Description: Public base URL for the REST API
    Value:
      Fn::Sub: "https://${PublicApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/"